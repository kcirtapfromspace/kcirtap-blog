<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <rect width="360" height="360" rx="8" fill="#1a1a2e"/>
  <!-- Grid lines -->
  <g stroke="#334" stroke-width="1">
    <line x1="40" y1="80" x2="320" y2="80"/>
    <line x1="40" y1="120" x2="320" y2="120"/>
    <line x1="40" y1="200" x2="320" y2="200"/>
    <line x1="40" y1="240" x2="320" y2="240"/>
    <line x1="133" y1="40" x2="133" y2="320"/>
    <line x1="173" y1="40" x2="173" y2="320"/>
    <line x1="253" y1="40" x2="253" y2="320"/>
    <line x1="293" y1="40" x2="293" y2="320"/>
  </g>
  <!-- Bold 3x3 box lines -->
  <g stroke="#556" stroke-width="2.5">
    <rect x="40" y="40" width="280" height="280" fill="none" rx="4"/>
    <line x1="133" y1="40" x2="133" y2="320"/>
    <line x1="227" y1="40" x2="227" y2="320"/>
    <line x1="40" y1="160" x2="320" y2="160"/>
    <line x1="40" y1="280" x2="320" y2="280"/>
  </g>
  <!-- Sample numbers - given (white) -->
  <g font-family="'Space Grotesk',sans-serif" font-size="22" fill="#e8e8e8" text-anchor="middle" dominant-baseline="central">
    <text x="60" y="60">5</text>
    <text x="153" y="60">8</text>
    <text x="273" y="60">2</text>
    <text x="100" y="100">3</text>
    <text x="193" y="100">7</text>
    <text x="313" y="100">6</text>
    <text x="60" y="140">9</text>
    <text x="233" y="140">4</text>
    <text x="153" y="180">1</text>
    <text x="253" y="180">8</text>
    <text x="60" y="220">4</text>
    <text x="193" y="220">6</text>
    <text x="100" y="260">7</text>
    <text x="273" y="260">3</text>
    <text x="60" y="300">2</text>
    <text x="193" y="300">9</text>
    <text x="313" y="300">1</text>
  </g>
  <!-- Player-entered numbers (accent color) -->
  <g font-family="'Space Grotesk',sans-serif" font-size="22" fill="#E23A2E" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="60">6</text>
    <text x="233" y="100">1</text>
    <text x="313" y="180">5</text>
    <text x="100" y="180">4</text>
  </g>
  <!-- Selected cell highlight -->
  <rect x="80" y="160" width="40" height="40" fill="#E23A2E" opacity="0.15" rx="2"/>
</svg>
