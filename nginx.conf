server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # ADS-B radar API proxy (variable proxy_pass defers DNS to request time)
    location /api/radar/ {
        resolver 10.96.0.10 valid=30s ipv6=off;
        set $radar_upstream http://ultrafeeder.adsb-tracker.svc.cluster.local:80;
        rewrite ^/api/radar/(.*) /$1 break;
        proxy_pass $radar_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # HTML files
    location / {
        default_type text/html;
        try_files $uri $uri/ /index.html;
    }

    # CSS files
    location ~* \.css$ {
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JavaScript files
    location ~* \.js$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WASM files
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Opener-Policy same-origin;
        expires 1y;
    }

    # Images
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
