server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Identify ourselves to cross-origin hosts. Cloudflare was injecting
    # `Referrer-Policy: same-origin`, which strips the Referer from every
    # cross-origin request — that is what made the map tile traffic look like
    # anonymous scraping to OSM/CARTO. Note Cloudflare may still override this
    # at the edge; the matching dashboard setting has to be turned off too.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # ADS-B radar API proxy (variable proxy_pass defers DNS to request time)
    location /api/radar/ {
        resolver 10.96.0.10 valid=30s ipv6=off;
        set $radar_upstream http://readsb.adsb-tracker.svc.cluster.local:8080;
        rewrite ^/api/radar/(.*) /$1 break;
        proxy_pass $radar_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Self-hosted Protomaps basemap. Served from the `basemap` deployment so the
    # radar pages no longer touch third-party tile servers at all.
    #
    # PMTiles reads the archive with HTTP range requests, so buffering is off and
    # the upstream's CORS/Accept-Ranges headers are passed through untouched —
    # do NOT add_header CORS here, duplicate Access-Control-Allow-Origin breaks it.
    location /tiles/ {
        resolver 10.96.0.10 valid=30s ipv6=off;
        set $basemap_upstream http://basemap.kcirtap.svc.cluster.local:8080;
        rewrite ^/tiles/(.*) /$1 break;
        proxy_pass $basemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # HTML files
    location / {
        default_type text/html;
        try_files $uri $uri/ /index.html;
    }

    # CSS files
    location ~* \.css$ {
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # JavaScript files
    location ~* \.js$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # WASM files
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
    }

    # Images
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
